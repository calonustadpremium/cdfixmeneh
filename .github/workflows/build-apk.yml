name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Force legacy PNG app icon
        shell: bash
        run: |
          set -e
          SRC="resources/icon.png"
          RES="android/app/src/main/res"

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp "$SRC" "$RES/mipmap-$d/ic_launcher.png"
            cp "$SRC" "$RES/mipmap-$d/ic_launcher_round.png"
          done

          # Remove adaptive-icon XML resources and old foreground/background assets.
          find "$RES" -type f \( \
            -path '*/mipmap-anydpi*/ic_launcher.xml' -o \
            -path '*/mipmap-anydpi*/ic_launcher_round.xml' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_background.xml' -o \
            -name 'ic_launcher_background.png' \
          \) -delete

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cathetan-dhuwit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
