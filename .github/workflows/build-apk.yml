name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android launcher icon
        run: npx capacitor-assets generate --android

      - name: Sync web app
        run: npx cap sync android

      - name: Configure clean Android system bars and app icon
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-v35

          # Use the Cathetan Dhuwit logo as the native app icon.
          cp resources/icon.png android/app/src/main/res/drawable/cd_app_icon.png

          # Base Android theme: normal system bars, no fullscreen flags.
          cat > android/app/src/main/res/values/cathetan_theme.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="CathetanDhuwit.NoEdgeToEdge" parent="AppTheme.NoActionBarLaunch">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:statusBarColor">#0969F5</item>
                  <item name="android:navigationBarColor">#F6F7FB</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          XML

          # Android 15: opt out of forced edge-to-edge so the WebView does not
          # cover the status bar and navigation bar.
          cat > android/app/src/main/res/values-v35/cathetan_theme.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="CathetanDhuwit.NoEdgeToEdge" parent="AppTheme.NoActionBarLaunch">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:statusBarColor">#0969F5</item>
                  <item name="android:navigationBarColor">#F6F7FB</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
              </style>
          </resources>
          XML

          MANIFEST=android/app/src/main/AndroidManifest.xml

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # Replace generated launcher icon references.
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/cd_app_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/cd_app_icon"')

          # Make sure the application has our icon even if the generated manifest differs.
          if '<application' in s and 'android:icon="@drawable/cd_app_icon"' not in s:
              s = s.replace('<application', '<application android:icon="@drawable/cd_app_icon"', 1)

          # Force the Capacitor activity to use our normal system-bar theme.
          s = s.replace(
              'android:theme="@style/AppTheme.NoActionBarLaunch"',
              'android:theme="@style/CathetanDhuwit.NoEdgeToEdge"'
          )

          p.write_text(s)
          PY

          echo "--- Manifest icon/theme check ---"
          grep -nE 'application|android:icon|android:roundIcon|android:theme' "$MANIFEST" || true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cathetan-dhuwit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
