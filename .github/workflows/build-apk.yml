name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Replace legacy Capacitor splash artwork
        shell: bash
        run: |
          set -e
          RES="android/app/src/main/res"
          SRC="resources/splash.png"

          # Replace every legacy Capacitor splash image that can show
          # before the WebView splash. This removes the default X artwork.
          find "$RES" -type f -name 'splash.png' -delete

          for f in $(find "$RES" -type d \(             -name 'drawable' -o             -name 'drawable-*'           \)); do
            mkdir -p "$f"
            cp "$SRC" "$f/splash.png"
          done

      - name: Force single PNG app icon
        shell: bash
        run: |
          set -e
          SRC="resources/icon.png"
          RES="android/app/src/main/res"

          # Remove every adaptive/foreground/background launcher resource
          # generated by Capacitor, leaving no alternate icon source.
          find "$RES" -type f \( \
            -iname '*ic_launcher_foreground*' -o \
            -iname '*ic_launcher_background*' -o \
            -iname 'ic_launcher.xml' -o \
            -iname 'ic_launcher_round.xml' \
          \) -delete

          # Remove old launcher PNGs first, then install our single PNG
          # in every density used by Android.
          find "$RES" -type f \( \
            -iname 'ic_launcher.png' -o \
            -iname 'ic_launcher_round.png' \
          \) -delete

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp "$SRC" "$RES/mipmap-$d/ic_launcher.png"
            cp "$SRC" "$RES/mipmap-$d/ic_launcher_round.png"
          done

          # Explicitly point the manifest at the PNG launcher resources.
          MANIFEST=$(find android/app/src/main -name AndroidManifest.xml | head -1)
          python3 - "$MANIFEST" <<'PY2'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher_round"', '')
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher"')
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              s = s.replace('<application', '<application android:icon="@mipmap/ic_launcher"', 1)
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@mipmap/ic_launcher"')
          if 'android:roundIcon=' not in s:
              s = s.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher"', 1)
          p.write_text(s)
          PY2

      - name: Configure Android system splash icon
        shell: bash
        run: |
          set -e
          RES="android/app/src/main/res"

          # Use the Cathetan Dhuwit logo for the Android 12+ system splash.
          cp resources/icon.png "$RES/drawable/cd_splash_icon.png"

          # Update the Capacitor launch theme without changing the app UI theme.
          STYLE=$(find "$RES" -path '*/values/styles.xml' -type f | head -1)
          if [ -z "$STYLE" ]; then
            echo "styles.xml not found"
            exit 1
          fi

          python3 - "$STYLE" <<'PY2'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          marker = '<style name="AppTheme.NoActionBarLaunch"'
          start = s.find(marker)
          if start == -1:
              raise SystemExit("AppTheme.NoActionBarLaunch not found")
          end = s.find('</style>', start)
          if end == -1:
              raise SystemExit("Launch style closing tag not found")
          end += len('</style>')
          block = s[start:end]

          import re
          block = re.sub(r'\s*<item name="windowSplashScreenAnimatedIcon">.*?</item>', '', block, flags=re.S)
          block = re.sub(r'\s*<item name="windowSplashScreenBackground">.*?</item>', '', block, flags=re.S)
          block = block.replace(
              '</style>',
              '\n        <item name="windowSplashScreenBackground">#0A69F5</item>\n'
              '        <item name="windowSplashScreenAnimatedIcon">@drawable/cd_splash_icon</item>\n'
              '</style>'
          )
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cathetan-dhuwit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
