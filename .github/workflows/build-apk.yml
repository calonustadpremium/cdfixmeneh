name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Configure native launcher icon
        shell: bash
        run: |
          set -e

          # Use resources/icon.png as the ONLY launcher icon source.
          # Do not run capacitor-assets: it can create a different icon set.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            cp resources/icon.png "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp resources/icon.png "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          # Remove any generated/default launcher resources before replacing them.
          rm -rf android/app/src/main/res/mipmap-anydpi
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          MANIFEST=android/app/src/main/AndroidManifest.xml

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # Force the manifest to use our mipmap launcher icon.
          s = s.replace('android:icon="@drawable/cd_app_icon"', 'android:icon="@mipmap/ic_launcher"')
          s = s.replace('android:roundIcon="@drawable/cd_app_icon"', 'android:roundIcon="@mipmap/ic_launcher_round"')
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher"')

          if '<application' in s and 'android:icon="@mipmap/ic_launcher"' not in s:
              s = s.replace('<application', '<application android:icon="@mipmap/ic_launcher"', 1)

          if 'android:roundIcon="@mipmap/ic_launcher_round"' not in s and '<application' in s:
              s = s.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)

          p.write_text(s)
          PY

          echo "--- Manifest icon check ---"
          grep -nE 'application|android:icon|android:roundIcon' "$MANIFEST" || true
          echo "--- Launcher icon files ---"
          find android/app/src/main/res -type f | grep -E 'mipmap-.*/ic_launcher(_round)?\.png' | sort

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cathetan-dhuwit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
